<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Admin | Julian Topup</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--side:#F3F5FF;--card:#FFFFFF;--line:#D5DAF3;--ink:#12153A;--mut:#565C8C;--acc:#3355F5;--ok:#0FB894;--bad:#C2255C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Kantumruy Pro',system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
aside h1{font-size:1.1rem;margin:0 8px 14px}aside h1 small{display:block;color:var(--mut);font-weight:400;font-size:.8rem}
nav button{display:block;width:100%;text-align:left;background:0;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(30,40,120,.12)}.faces{display:flex;gap:8px;margin:0 8px 14px}.faces img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);background:#fff}
main{flex:1;padding:20px;min-width:0;max-width:960px}h2{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mut)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font:inherit;min-height:40px}
input[type=color]{padding:2px}input[type=checkbox]{width:auto;min-height:0}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
button.b.s{background:var(--side);color:var(--ink);border:1px solid var(--line)}button.b.d{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.stat{font-size:2rem;font-weight:700;color:var(--ok)}
img.pv{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--bg);display:block;margin-bottom:4px}
.mut{color:var(--mut);font-size:.9rem}#t{position:fixed;bottom:16px;right:16px;background:var(--ok);color:#fff;padding:8px 14px;border-radius:10px;display:none}
@media(max-width:720px){body{display:block}aside{width:auto;height:auto;position:static;border:0}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}}
</style></head><body>

function f(l,o,k,t){R.push([o,k,t]);return '<label>'+l+'<input data-r="'+(R.length-1)+'" '+(t==='n'?'type="number" step="any"':t==='c'?'type="color"':'')+' value="'+esc(o[k])+'"></label>'}
function im(l,o,k,n){R.push([o,k,n]);return '<label>'+l+(o[k]?'<img class="pv" src="'+esc(o[k])+'" alt="">':'')+'<input type="file" accept="image/*" data-f="'+(R.length-1)+'"><input data-r="'+(R.length-1)+'" placeholder="ឬដាក់តំណ URL" value="'+(String(o[k]||'').indexOf('data:')===0?'':esc(o[k]))+'"></label>'}
document.addEventListener('input',function(e){var r=e.target.dataset.r;if(r==null)return;var x=R[r];x[0][x[1]]=x[2]==='n'?+e.target.value:e.target.value;save()});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.f!=null){var x=R[t.dataset.f],fl=t.files[0];if(!fl)return;shrink(fl,x[2]||256,function(u){x[0][x[1]]=u;save();draw()})}
 if(t.dataset.sv!=null){C.games[t.dataset.sv].server=t.checked;save()}if(t.id==='gs'){sel=+t.value;draw()}});
function shrink(file,n,cb){var i=new Image();i.onload=function(){var s=Math.min(1,n/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/webp',.85))};i.src=URL.createObjectURL(file)}
function nav(){$('#nav').innerHTML=T.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')}
function go(t){tab=t;draw()}
function draw(){R=[];nav();var h='';
 if(tab==='dash'){var p=0;C.games.forEach(function(g){p+=(g.packs||[]).length});
  h='<h2>ផ្ទាំងគ្រប់គ្រង</h2><div class="g"><div class="card">ហ្គេម<div class="stat">'+C.games.length+'</div></div><div class="card">កញ្ចប់<div class="stat">'+p+'</div></div><div class="card">គណនីលក់<div class="stat">'+(C.accounts||[]).length+'</div></div></div>'+
  '<div class="card"><b>របៀបបង្ហោះការកែប្រែ</b><ol class="mut"><li>កែនៅទំព័រនានា (រក្សាទុកដោយស្វ័យប្រវត្តិក្នុង browser នេះ)</li><li>ចុច «ទាញយក» ហើយជំនួសឯកសារ <b>shop-config.json</b> ក្នុង repo</li><li>Push ទៅ GitHub → Vercel Deploy ស្វ័យប្រវត្តិ</li></ol><div class="row"><button class="b" onclick="dl()">ទាញយក shop-config.json</button><button class="b s" onclick="navigator.clipboard.writeText(JSON.stringify(C,null,1)).then(function(){toast(\'បានចម្លង\')})">ចម្លង JSON</button><button class="b d" onclick="if(confirm(\'ផ្ទុកឡើងវិញពី Server? ការកែដែលមិនទាន់ទាញយកនឹងបាត់\')){localStorage.removeItem(\'jt-admin\');fromServer().then(draw)}">ផ្ទុកពី Server</button></div></div>'+
  '<p class="mut">ប្រវត្តិបញ្ជាទិញ៖ ការទិញនីមួយៗផ្ញើ Game ID ទៅក្រុម Telegram (មើលផ្ទាំង Telegram)។</p>'}
 if(tab==='games'){h='<h2>ហ្គេម</h2><button class="b" onclick="addG()">+ បន្ថែមហ្គេម</button><br><br>'+C.games.map(function(g,i){return '<div class="card"><div class="g">'+im('Logo ហ្គេម',g,'logo')+f('ឈ្មោះខ្លី',g,'short')+f('ឈ្មោះពេញ',g,'name')+f('តំបន់',g,'region')+f('ពណ៌',g,'tint','c')+f('ឯកតា (EN)',g,'unit')+f('ឯកតា (ខ្មែរ)',g,'unitKm')+'<label>ត្រូវការ Server ID<br><input type="checkbox" data-sv="'+i+'" '+(g.server?'checked':'')+'></label></div><br><button class="b d" onclick="if(confirm(\'លុប?\')){C.games.splice('+i+',1);save();draw()}">លុប</button></div>'}).join('')}
 if(tab==='prod'){var g=C.games[sel]||C.games[0];h='<h2>កញ្ចប់ & តម្លៃ</h2><label>ជ្រើសហ្គេម<select id="gs">'+C.games.map(function(x,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(x.short)+'</option>'}).join('')+'</select></label><br>';
  if(g){h+=g.packs.map(function(p,i){var o={q:p[0],u:p[1],i:p[2]||''};return '<div class="card"><div class="g">'+pf('ចំនួន',g,i,0)+pf('តម្លៃ $',g,i,1)+pim(g,i)+'</div><br><button class="b d" onclick="C.games['+sel+'].packs.splice('+i+',1);save();draw()">លុប</button></div>'}).join('')+'<button class="b" onclick="C.games['+sel+'].packs.push([100,1]);save();draw()">+ បន្ថែមកញ្ចប់</button>'}}
 if(tab==='pay'){var k=C.khqr;h='<h2>ការបង់ប្រាក់</h2><div class="card"><b>KHQR</b><div class="g">'+f('Bakong Account ID',k,'account')+f('ឈ្មោះអ្នកលក់ (EN)',k,'name')+f('ទីក្រុង',k,'city')+f('រូបិយប័ណ្ណ (USD/KHR)',k,'currency')+f('ផុតកំណត់ (នាទី)',k,'expireMin','n')+f('អត្រា ១$ = ៛',C,'rate','n')+'</div></div>'+C.pays.map(function(p){return '<div class="card"><div class="g">'+f('វិធីបង់',p,'name')+f('ពិពណ៌នា',p,'desc')+'</div></div>'}).join('')}
 if(tab==='tg'){h='<h2>Telegram</h2><div class="card"><div class="g">'+f('Username ហាង (គ្មាន @)',C,'telegram')+'</div></div><div class="card"><b>Bot ផ្ញើ Game ID ទៅក្រុម</b><p class="mut">Token ត្រូវរក្សាសម្ងាត់ មិនដាក់ក្នុងទំព័រនេះទេ។ ក្នុង Vercel → Settings → Environment Variables ដាក់៖<br><b>TELEGRAM_BOT_TOKEN</b> (ពី @BotFather) និង <b>TELEGRAM_CHAT_ID</b> (ID ក្រុម ចាប់ផ្ដើម -100…) រួច Redeploy។ បន្ថែម Bot ចូលក្រុមជា admin។</p></div>'}
 if(tab==='shop'){var s=C.shop;h='<h2>ហាង</h2><div class="card"><div class="g">'+f('ឈ្មោះហាង',s,'name')+f('ពាក្យពណ៌នា',s,'sub')+im('រូបបដា (Banner)',s,'banner',1000)+'</div></div>'}
 $('#m').innerHTML=h}
function pf(l,g,i,j){var o={v:g.packs[i][j]};R.push([g.packs[i],j,'n']);return '<label>'+l+'<input type="number" step="any" data-r="'+(R.length-1)+'" value="'+esc(g.packs[i][j])+'"></label>'}
function pim(g,i){var p=g.packs[i];R.push([p,2]);return '<label>រូបកញ្ចប់'+(p[2]?'<img class="pv" src="'+esc(p[2])+'" alt="">':'')+'<input type="file" accept="image/*" data-f="'+(R.length-1)+'"></label>'}
function addG(){C.games.unshift({id:'game-'+Date.now().toString(36),short:'ហ្គេមថ្មី',name:'New Game',region:'GLOBAL',mono:'NG',tint:'#3355F5',unit:'Diamonds',unitKm:'គ្រាប់ពេជ្រ',server:false,idType:'num',pop:2,packs:[[100,1]]});save();draw()}
function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C)],{type:'application/json'}));a.download='shop-config.json';a.click()}
load().then(draw);
</script></body></html>
